name: ShellCheck

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  shellcheck:
    name: ShellCheck static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck on all shell scripts
        run: |
          # Discover all .sh files and any extensionless files with a bash/sh shebang
          mapfile -t SCRIPTS < <(
            {
              find . -not -path './.git/*' -not -path './.vim/*' -name "*.sh"
              find . -not -path './.git/*' -not -path './.vim/*' -type f -exec grep -lE '^#!.*([ /]bash|[ /]sh)' {} +
            } | sort -u
          )

          echo "Linting ${#SCRIPTS[@]} scripts with ShellCheck:"
          printf ' - %s\n' "${SCRIPTS[@]}"

          shellcheck --severity=warning --format=gcc "${SCRIPTS[@]}"
