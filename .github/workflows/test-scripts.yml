name: Test Scripts

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]


jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # gen-passwd
  # ─────────────────────────────────────────────────────────────────────────────
  test-gen-passwd:
    name: Test gen-passwd
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Make executable
        run: chmod +x common-bin/gen-passwd

      - name: Default length is 16
        run: |
          output=$(common-bin/gen-passwd)
          len=${#output}
          [ "$len" -eq 16 ] || { echo "FAIL: expected length 16, got $len ('$output')"; exit 1; }
          echo "PASS: default length = $len"

      - name: Custom length (32)
        run: |
          output=$(common-bin/gen-passwd 32)
          len=${#output}
          [ "$len" -eq 32 ] || { echo "FAIL: expected length 32, got $len"; exit 1; }
          echo "PASS: custom length = $len"

      - name: Uppercase-only flag (-u)
        run: |
          output=$(common-bin/gen-passwd -u 20)
          echo "$output" | grep -qE '^[A-Z]+$' \
            || { echo "FAIL: expected only uppercase, got: $output"; exit 1; }
          echo "PASS: uppercase only: $output"

      - name: Numbers-only flag (-n)
        run: |
          output=$(common-bin/gen-passwd -n 20)
          echo "$output" | grep -qE '^[0-9]+$' \
            || { echo "FAIL: expected only numbers, got: $output"; exit 1; }
          echo "PASS: numbers only: $output"

      - name: Lowercase-only flag (-l)
        run: |
          output=$(common-bin/gen-passwd -l 20)
          echo "$output" | grep -qE '^[a-z]+$' \
            || { echo "FAIL: expected only lowercase, got: $output"; exit 1; }
          echo "PASS: lowercase only: $output"

      - name: Combined flags (-u -l -n)
        run: |
          output=$(common-bin/gen-passwd -u -l -n 40)
          len=${#output}
          [ "$len" -eq 40 ] || { echo "FAIL: expected length 40, got $len"; exit 1; }
          echo "$output" | grep -qE '^[A-Za-z0-9]+$' \
            || { echo "FAIL: unexpected chars in: $output"; exit 1; }
          echo "PASS: combined flags: $output"

      - name: Non-numeric length argument exits non-zero
        run: |
          common-bin/gen-passwd abc && { echo "FAIL: should have exited non-zero"; exit 1; } || echo "PASS: non-numeric length rejected"

      - name: Report Summary
        if: always()
        run: |
          echo "### 🧪 \`gen-passwd\` Test Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ **All test assertions passed successfully.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Test failed! Check step logs above for details.**" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # repeat-until-success
  # ─────────────────────────────────────────────────────────────────────────────
  test-repeat-until-success:
    name: Test repeat-until-success
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Make executable
        run: chmod +x common-bin/repeat-until-success

      - name: Succeeds immediately with 'true'
        run: common-bin/repeat-until-success -n 3 -s 0 true

      - name: Fails after max retries with 'false'
        run: |
          common-bin/repeat-until-success -n 3 -s 0 false \
            && { echo "FAIL: should have exited non-zero after max retries"; exit 1; } \
            || echo "PASS: exited non-zero after max retries"

      - name: Succeeds on later attempt
        run: |
          # Write a counter to a temp file; succeed once count reaches 3
          COUNT_FILE=$(mktemp)
          echo 0 > "$COUNT_FILE"
          TRY_SCRIPT=$(mktemp)
          cat > "$TRY_SCRIPT" <<EOF
          #!/bin/bash
          count=\$(cat "$COUNT_FILE")
          count=\$((count + 1))
          echo \$count > "$COUNT_FILE"
          [ "\$count" -ge 3 ]
          EOF
          chmod +x "$TRY_SCRIPT"
          common-bin/repeat-until-success -n 5 -s 0 "$TRY_SCRIPT"
          final=$(cat "$COUNT_FILE")
          [ "$final" -eq 3 ] || { echo "FAIL: expected 3 attempts, got $final"; exit 1; }
          echo "PASS: succeeded on attempt $final"

      - name: Report Summary
        if: always()
        run: |
          echo "### 🧪 \`repeat-until-success\` Test Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ **All test assertions passed successfully.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Test failed! Check step logs above for details.**" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # sum
  # ─────────────────────────────────────────────────────────────────────────────
  test-sum:
    name: Test sum
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Make executable
        run: chmod +x common-bin/sum

      - name: Sum a list of integers
        run: |
          result=$(printf '1\n2\n3\n4\n5\n' | common-bin/sum)
          [ "$result" -eq 15 ] || { echo "FAIL: expected 15, got $result"; exit 1; }
          echo "PASS: 1+2+3+4+5 = $result"

      - name: Sum with negative numbers
        run: |
          result=$(printf '10\n-3\n7\n' | common-bin/sum)
          [ "$result" -eq 14 ] || { echo "FAIL: expected 14, got $result"; exit 1; }
          echo "PASS: 10+(-3)+7 = $result"

      - name: Sum positional arguments
        run: |
          result=$(common-bin/sum 1 2 3 4)
          [ "$result" -eq 10 ] || { echo "FAIL: expected 10, got $result"; exit 1; }
          echo "PASS: sum 1 2 3 4 = $result"

      - name: Sum comma-separated values
        run: |
          result=$(common-bin/sum 1,2,3,4,5)
          [ "$result" -eq 15 ] || { echo "FAIL: expected 15, got $result"; exit 1; }
          echo "PASS: comma-separated values = $result"

      - name: Sum delimited column (-d and -k)
        run: |
          result=$(printf "item1:100:foo\nitem2:250:bar\nitem3:50:baz\n" | common-bin/sum -d ':' -k 2)
          [ "$result" -eq 400 ] || { echo "FAIL: expected 400, got $result"; exit 1; }
          echo "PASS: delimited column sum = $result"

      - name: Sum multiple file arguments
        run: |
          FILE1=$(mktemp)
          FILE2=$(mktemp)
          echo "10 20" > "$FILE1"
          echo "30 40" > "$FILE2"
          result=$(common-bin/sum "$FILE1" "$FILE2")
          rm -f "$FILE1" "$FILE2"
          [ "$result" -eq 100 ] || { echo "FAIL: expected 100, got $result"; exit 1; }
          echo "PASS: file argument sum = $result"

      - name: Sum human-readable byte units (-H)
        run: |
          result=$(common-bin/sum -H 10K 5M 2G)
          # 10*1024 + 5*1048576 + 2*1073741824 = 10240 + 5242880 + 2147483648 = 2152736768
          [ "$result" = "2.15274e+09" ] || [ "$result" = "2152736768" ] || { echo "FAIL: got $result"; exit 1; }
          echo "PASS: human-readable units = $result"

      - name: Compute average (-a) and formatted output (-f)
        run: |
          result=$(common-bin/sum -a -f "%.2f" 10 20 30 40)
          [ "$result" = "25.00" ] || { echo "FAIL: expected 25.00, got $result"; exit 1; }
          echo "PASS: average formatted = $result"

      - name: Output summary statistics (-s)
        run: |
          output=$(common-bin/sum -s 5 10 15 20)
          echo "$output" | grep -q "count: 4" || { echo "FAIL count"; exit 1; }
          echo "$output" | grep -q "min: 5" || { echo "FAIL min"; exit 1; }
          echo "$output" | grep -q "max: 20" || { echo "FAIL max"; exit 1; }
          echo "$output" | grep -q "mean: 12.5" || { echo "FAIL mean"; exit 1; }
          echo "$output" | grep -q "sum: 50" || { echo "FAIL sum"; exit 1; }
          echo "PASS: summary statistics"

      - name: Report Summary
        if: always()
        run: |
          echo "### 🧪 \`sum\` Test Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ **All test assertions passed successfully.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Test failed! Check step logs above for details.**" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # install-go  (download + install a real Go release)
  # ─────────────────────────────────────────────────────────────────────────────
  test-install-go:
    name: Test install-go
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Make executable
        run: chmod +x common-bin/install-go

      - name: Create SDK directory
        run: mkdir -p "$HOME/software/sdk"

      - name: List available versions (-l flag)
        run: common-bin/install-go -l | tail -5

      - name: Install Go 1.22.4
        run: common-bin/install-go -v go1.22.4

      - name: Verify installation directory exists
        run: |
          [ -d "$HOME/software/sdk/go1.22.4" ] \
            || { echo "FAIL: sdk dir not found"; exit 1; }
          echo "PASS: go1.22.4 installed at $HOME/software/sdk/go1.22.4"

      - name: Already-installed short-circuits cleanly
        run: common-bin/install-go -v go1.22.4

      - name: Rejects malformed version
        run: |
          common-bin/install-go -v 1.22.4 \
            && { echo "FAIL: should reject version missing 'go' prefix"; exit 1; } \
            || echo "PASS: malformed version rejected"

      - name: Report Summary
        if: always()
        run: |
          echo "### 🧪 \`install-go\` Test Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ **All test assertions passed successfully.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Test failed! Check step logs above for details.**" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # switch-go
  # ─────────────────────────────────────────────────────────────────────────────
  test-switch-go:
    name: Test switch-go
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Make executables
        run: chmod +x common-bin/install-go common-bin/switch-go

      - name: Set up SDK dir and install two Go versions
        run: |
          mkdir -p "$HOME/software/sdk"
          common-bin/install-go -v go1.22.4
          common-bin/install-go -v go1.21.12

      - name: List installed versions (-l flag)
        run: common-bin/switch-go -l

      - name: Switch to go1.21.12
        run: |
          common-bin/switch-go -v go1.21.12
          target=$(readlink "$HOME/software/sdk/go")
          echo "Symlink points to: $target"
          echo "$target" | grep -q "go1.21.12" \
            || { echo "FAIL: symlink should point to go1.21.12"; exit 1; }
          echo "PASS"

      - name: Switch to go1.22.4
        run: |
          common-bin/switch-go -v go1.22.4
          target=$(readlink "$HOME/software/sdk/go")
          echo "$target" | grep -q "go1.22.4" \
            || { echo "FAIL: symlink should point to go1.22.4"; exit 1; }
          echo "PASS"

      - name: Rejects uninstalled version
        run: |
          common-bin/switch-go -v go9.9.9 \
            && { echo "FAIL: should reject uninstalled version"; exit 1; } \
            || echo "PASS: uninstalled version rejected"

      - name: Report Summary
        if: always()
        run: |
          echo "### 🧪 \`switch-go\` Test Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ **All test assertions passed successfully.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Test failed! Check step logs above for details.**" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # install-tf
  # ─────────────────────────────────────────────────────────────────────────────
  test-install-tf:
    name: Test install-tf
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Make executable
        run: chmod +x common-bin/install-tf

      - name: Show usage (-h flag)
        run: common-bin/install-tf -h

      - name: Rejects malformed version
        run: |
          common-bin/install-tf -v abc \
            && { echo "FAIL: should reject malformed version"; exit 1; } \
            || echo "PASS: malformed version rejected"

      - name: Install Terraform 1.8.5
        run: common-bin/install-tf -v 1.8.5

      - name: Verify Terraform binary
        run: |
          [ -x "$HOME/bin/terraform" ] || { echo "FAIL: terraform binary not executable"; exit 1; }
          "$HOME/bin/terraform" version

      - name: Report Summary
        if: always()
        run: |
          echo "### 🧪 \`install-tf\` Test Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ **All test assertions passed successfully.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Test failed! Check step logs above for details.**" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # mvn-release
  # ─────────────────────────────────────────────────────────────────────────────
  test-mvn-release:
    name: Test mvn-release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Make executable
        run: chmod +x common-bin/mvn-release

      - name: Rejects invalid branch
        run: |
          TMP_REPO=$(mktemp -d)
          git init "$TMP_REPO"
          cd "$TMP_REPO"
          git config user.email "ci@example.com"
          git config user.name "CI Runner"
          git checkout -b feature-branch
          "$GITHUB_WORKSPACE/common-bin/mvn-release" \
            && { echo "FAIL: should reject non-master/develop branch"; exit 1; } \
            || echo "PASS: disallowed branch rejected"

      - name: Report Summary
        if: always()
        run: |
          echo "### 🧪 \`mvn-release\` Test Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ **All test assertions passed successfully.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Test failed! Check step logs above for details.**" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # macOS common-bin test suite
  # ─────────────────────────────────────────────────────────────────────────────
  test-scripts-macos:
    name: Test common-bin scripts (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x common-bin/*

      - name: Test gen-passwd on macOS
        run: |
          output=$(common-bin/gen-passwd)
          [ "${#output}" -eq 16 ] || { echo "FAIL length"; exit 1; }
          output32=$(common-bin/gen-passwd -u 32)
          [ "${#output32}" -eq 32 ] || { echo "FAIL len 32"; exit 1; }
          echo "$output32" | grep -qE '^[A-Z]+$' || { echo "FAIL uppercase"; exit 1; }
          echo "PASS: gen-passwd on macOS"

      - name: Test repeat-until-success on macOS
        run: |
          common-bin/repeat-until-success -n 3 -s 0 true
          common-bin/repeat-until-success -n 3 -s 0 false && exit 1 || echo "PASS"

      - name: Test sum on macOS
        run: |
          res=$(common-bin/sum 1 2 3 4 5)
          [ "$res" -eq 15 ] || { echo "FAIL sum"; exit 1; }
          echo "PASS: sum on macOS"

      - name: Test install-tf on macOS
        run: |
          common-bin/install-tf -v 1.8.5
          "$HOME/bin/terraform" version
          echo "PASS: install-tf on macOS"

      - name: Test install-go and switch-go on macOS
        run: |
          mkdir -p "$HOME/software/sdk"
          common-bin/install-go -v go1.22.4
          common-bin/switch-go -v go1.22.4
          [ -d "$HOME/software/sdk/go1.22.4" ] || { echo "FAIL go dir"; exit 1; }
          echo "PASS: install-go & switch-go on macOS"



