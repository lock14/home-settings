name: Integration Tests

on:
  push:
    branches: [master, main]
    paths:
      - 'ubuntu/**'
      - 'fedora/**'
      - 'zsh-setup.sh'
      - 'zsh_aliases'
      - 'zsh_functions'
      - 'zshrc_addendum'
      - 'zsh_completions'
      - 'completions-setup.sh'
      - 'p10k.zsh'
      - 'font-setup.sh'
      - '.vimrc'
      - 'vim-setup.sh'
      - 'bash-setup.sh'
      - 'bashrc-addendum'
      - 'bin-setup.sh'
      - 'user-setup.sh'
      - 'gnome-terminal-setup.sh'
      - 'environment_variables'
      - 'tests/**'
      - 'Makefile'
      - '.github/workflows/integration-tests.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'ubuntu/**'
      - 'fedora/**'
      - 'zsh-setup.sh'
      - 'zsh_aliases'
      - 'zsh_functions'
      - 'zshrc_addendum'
      - 'zsh_completions'
      - 'completions-setup.sh'
      - 'p10k.zsh'
      - 'font-setup.sh'
      - '.vimrc'
      - 'vim-setup.sh'
      - 'bash-setup.sh'
      - 'bashrc-addendum'
      - 'bin-setup.sh'
      - 'user-setup.sh'
      - 'gnome-terminal-setup.sh'
      - 'environment_variables'
      - 'tests/**'
      - 'Makefile'
      - '.github/workflows/integration-tests.yml'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Dotfiles & Makefile Setup
  # ─────────────────────────────────────────────────────────────────────────────
  test-dotfiles-makefile:
    name: Dotfiles Makefile & Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test modular Makefile targets
        run: |
          # Test env module
          make install-env
          [ -L "$HOME/.environment_variables" ] && [ -L "$HOME/.dir_colors/dircolors" ] || { echo "FAIL: install-env"; exit 1; }
          make uninstall-env
          [ ! -e "$HOME/.environment_variables" ] && [ ! -e "$HOME/.dir_colors/dircolors" ] || { echo "FAIL: uninstall-env"; exit 1; }

          # Test fonts module
          make install-fonts
          [ -f "$HOME/.local/share/fonts/MesloLGS NF Regular.ttf" ] || { echo "FAIL: install-fonts"; exit 1; }
          make uninstall-fonts
          [ ! -e "$HOME/.local/share/fonts/MesloLGS NF Regular.ttf" ] || { echo "FAIL: uninstall-fonts"; exit 1; }

          # Test completions module
          make install-completions
          [ -L "$HOME/.zsh_completions" ] && [ -d "$HOME/.zsh/completions" ] || { echo "FAIL: install-completions"; exit 1; }
          make uninstall-completions
          [ ! -e "$HOME/.zsh_completions" ] && [ ! -e "$HOME/.zsh/completions" ] || { echo "FAIL: uninstall-completions"; exit 1; }

          # Test zsh module
          make install-zsh
          [ -L "$HOME/.zsh_aliases" ] && [ -L "$HOME/.zsh_functions" ] && [ -L "$HOME/.zshrc_addendum" ] && [ -L "$HOME/.zsh_completions" ] && [ -L "$HOME/.p10k.zsh" ] || { echo "FAIL: install-zsh"; exit 1; }
          make uninstall-zsh
          [ ! -e "$HOME/.zsh_aliases" ] && [ ! -e "$HOME/.zsh_functions" ] && [ ! -e "$HOME/.zshrc_addendum" ] && [ ! -e "$HOME/.zsh_completions" ] && [ ! -e "$HOME/.p10k.zsh" ] || { echo "FAIL: uninstall-zsh"; exit 1; }

          # Test bash module
          make install-bash
          [ -L "$HOME/.bashrc-addendum" ] || { echo "FAIL: install-bash"; exit 1; }
          make uninstall-bash
          [ ! -e "$HOME/.bashrc-addendum" ] || { echo "FAIL: uninstall-bash"; exit 1; }

          # Test vim module
          make install-vim
          [ -L "$HOME/.vimrc" ] && [ -L "$HOME/.vim/UltiSnips" ] || { echo "FAIL: install-vim"; exit 1; }
          make uninstall-vim
          [ ! -e "$HOME/.vimrc" ] && [ ! -e "$HOME/.vim/UltiSnips" ] || { echo "FAIL: uninstall-vim"; exit 1; }

          # Test bin module
          make install-bin
          [ -x "$HOME/bin/gen-passwd" ] || { echo "FAIL: install-bin"; exit 1; }
          make uninstall-bin
          [ ! -e "$HOME/bin/gen-passwd" ] || { echo "FAIL: uninstall-bin"; exit 1; }

          echo "PASS: All modular make targets installed and uninstalled cleanly"

      - name: Test Full Makefile install & uninstall
        run: |
          make install
          # Verify dotfile symlinks and fonts exist
          [ -f "$HOME/.local/share/fonts/MesloLGS NF Regular.ttf" ] || { echo "FAIL: MesloLGS NF fonts missing"; exit 1; }
          [ -L "$HOME/.vimrc" ] || { echo "FAIL: ~/.vimrc symlink missing"; exit 1; }
          [ -L "$HOME/.vim/UltiSnips" ] || { echo "FAIL: ~/.vim/UltiSnips symlink missing"; exit 1; }
          [ -L "$HOME/.zsh_aliases" ] || { echo "FAIL: ~/.zsh_aliases symlink missing"; exit 1; }
          [ -L "$HOME/.zsh_functions" ] || { echo "FAIL: ~/.zsh_functions symlink missing"; exit 1; }
          [ -L "$HOME/.zshrc_addendum" ] || { echo "FAIL: ~/.zshrc_addendum symlink missing"; exit 1; }
          [ -L "$HOME/.zsh_completions" ] || { echo "FAIL: ~/.zsh_completions symlink missing"; exit 1; }
          [ -L "$HOME/.p10k.zsh" ] || { echo "FAIL: ~/.p10k.zsh symlink missing"; exit 1; }
          [ -L "$HOME/.bashrc-addendum" ] || { echo "FAIL: ~/.bashrc-addendum symlink missing"; exit 1; }
          [ -L "$HOME/.environment_variables" ] || { echo "FAIL: ~/.environment_variables symlink missing"; exit 1; }
          [ -L "$HOME/.dir_colors/dircolors" ] || { echo "FAIL: ~/.dir_colors/dircolors symlink missing"; exit 1; }
          [ -x "$HOME/bin/gen-passwd" ] || { echo "FAIL: ~/bin/gen-passwd missing"; exit 1; }
          echo "PASS: make install created all symlinks, fonts, and bin tools"

          make uninstall
          [ ! -e "$HOME/.local/share/fonts/MesloLGS NF Regular.ttf" ] || { echo "FAIL: MesloLGS NF fonts still exist"; exit 1; }
          [ ! -e "$HOME/.vimrc" ] || { echo "FAIL: ~/.vimrc still exists"; exit 1; }
          [ ! -e "$HOME/.vim/UltiSnips" ] || { echo "FAIL: ~/.vim/UltiSnips still exists"; exit 1; }
          [ ! -e "$HOME/.zsh_aliases" ] || { echo "FAIL: ~/.zsh_aliases still exists"; exit 1; }
          [ ! -e "$HOME/.zsh_completions" ] || { echo "FAIL: ~/.zsh_completions still exists"; exit 1; }
          [ ! -e "$HOME/.p10k.zsh" ] || { echo "FAIL: ~/.p10k.zsh still exists"; exit 1; }
          [ ! -e "$HOME/.environment_variables" ] || { echo "FAIL: ~/.environment_variables still exists"; exit 1; }
          [ ! -e "$HOME/bin/gen-passwd" ] || { echo "FAIL: ~/bin/gen-passwd still exists"; exit 1; }
          echo "PASS: make uninstall cleaned all symlinks, fonts, and bin tools"

      - name: Report Summary
        if: always()
        run: |
          echo "### 📦 Dotfiles & Makefile Test Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ **\`make install\` / \`make uninstall\` and \`bin-setup.sh\` passed.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Dotfiles test failed! Check step logs for details.**" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Ubuntu Setup Script
  # ─────────────────────────────────────────────────────────────────────────────
  test-ubuntu:
    name: Ubuntu Setup Script
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Test CLI help and argument validation
        run: |
          chmod +x ubuntu/ubuntu_18+_setup.sh
          # Show help
          ./ubuntu/ubuntu_18+_setup.sh -h
          # Reject invalid JDK
          ./ubuntu/ubuntu_18+_setup.sh -j openjdk-99 && { echo "FAIL: should reject invalid JDK"; exit 1; } || echo "PASS: invalid JDK rejected"
          # Reject invalid IDE
          ./ubuntu/ubuntu_18+_setup.sh -i invalid-ide && { echo "FAIL: should reject invalid IDE"; exit 1; } || echo "PASS: invalid IDE rejected"

      - name: Disable Reboot & Sleep
        run: |
          sed -i 's/systemctl reboot/echo "skipping reboot"/g' ubuntu/ubuntu_18+_setup.sh
          sed -i 's/sleep [0-9]*/echo "skipping sleep"/g' ubuntu/ubuntu_18+_setup.sh

      - name: Run Ubuntu Setup (Default args)
        run: |
          sudo ./ubuntu/ubuntu_18+_setup.sh

      - name: Report Summary
        if: always()
        run: |
          echo "### 🐧 Ubuntu Setup Script Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ **Ubuntu setup executed successfully with no errors.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Ubuntu setup script failed! Check step logs for details.**" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Fedora Setup Script
  # ─────────────────────────────────────────────────────────────────────────────
  test-fedora:
    name: Fedora Setup Script
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Mocks and Disable Reboot
        run: |
          dnf -y install sudo curl wget findutils
          # Mock snap for docker container environment
          echo '#!/bin/bash' > /usr/bin/snap
          echo 'echo "Mocking snap command: $@"' >> /usr/bin/snap
          chmod +x /usr/bin/snap
          
          # Disable reboot and sleep
          sed -i 's/systemctl reboot/echo "skipping reboot"/g' fedora/fedora_30+_setup.sh
          sed -i 's/sleep [0-9]*/echo "skipping sleep"/g' fedora/fedora_30+_setup.sh

      - name: Test CLI help and argument validation
        run: |
          chmod +x fedora/fedora_30+_setup.sh
          # Show help
          ./fedora/fedora_30+_setup.sh -h
          # Reject invalid JDK
          ./fedora/fedora_30+_setup.sh -j openjdk-99 && { echo "FAIL: should reject invalid JDK"; exit 1; } || echo "PASS: invalid JDK rejected"
          # Reject invalid IDE
          ./fedora/fedora_30+_setup.sh -i invalid-ide && { echo "FAIL: should reject invalid IDE"; exit 1; } || echo "PASS: invalid IDE rejected"

      - name: Run Fedora Setup (Default args)
        run: |
          sudo ./fedora/fedora_30+_setup.sh

      - name: Report Summary
        if: always()
        run: |
          echo "### 🎩 Fedora Setup Script Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ **Fedora setup executed successfully with no errors.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Fedora setup script failed! Check step logs for details.**" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Zsh Setup Script
  # ─────────────────────────────────────────────────────────────────────────────
  test-zsh-setup:
    name: Zsh Setup Script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Disable chsh (requires password/interactive)
        run: |
          sed -i 's/chsh -s/echo "skipping chsh -s"/g' zsh-setup.sh

      - name: Run Zsh Setup
        run: |
          ./zsh-setup.sh
          # Verify powerlevel10k was installed
          ls -la ~/.oh-my-zsh/custom/themes/powerlevel10k

      - name: Report Summary
        if: always()
        run: |
          echo "### 🐚 Zsh Setup Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ **Zsh, Oh-My-Zsh, and Powerlevel10k installed successfully.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Zsh setup failed! Check step logs for details.**" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Shell & Vim Dotfiles Unit Tests
  # ─────────────────────────────────────────────────────────────────────────────
  test-dotfiles-and-configs:
    name: Shell & Vim Dotfiles Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh vim git tree fd-find shellcheck
          if command -v fdfind &>/dev/null && ! command -v fd &>/dev/null; then
            sudo ln -s "$(which fdfind)" /usr/local/bin/fd
          fi

      - name: Run lint & unit tests
        run: |
          make lint
          make test

      - name: Report Summary
        if: always()
        run: |
          echo "### ⚙️ Shell & Vim Configuration Test Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ **All Zsh and Vim unit tests, alias checks, and syntax validations passed.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Dotfile configuration tests failed! Check step logs for details.**" >> "$GITHUB_STEP_SUMMARY"
          fi



