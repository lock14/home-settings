name: Integration Tests

on:
  push:
    branches: [master, main]
    paths:
      - 'setup.sh'
      - 'Makefile'
      - '.mise.toml'
      - 'dotfiles/**'
      - 'common-bin/**'
      - '.vim/**'
      - 'tests/**'
      - '.github/workflows/integration-tests.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'setup.sh'
      - 'Makefile'
      - '.mise.toml'
      - 'dotfiles/**'
      - 'common-bin/**'
      - '.vim/**'
      - 'tests/**'
      - '.github/workflows/integration-tests.yml'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Dotfiles & Makefile Setup
  # ─────────────────────────────────────────────────────────────────────────────
  test-dotfiles-makefile:
    name: Dotfiles & Makefile Lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test modular Makefile targets
        run: |
          # Test dotfiles install & uninstall
          make install-dotfiles
          [ -L "$HOME/.environment_variables" ] && [ -L "$HOME/.dir_colors/dircolors" ] && [ -L "$HOME/.vimrc" ] || { echo "FAIL: install-dotfiles"; exit 1; }
          make uninstall-dotfiles
          [ ! -e "$HOME/.environment_variables" ] && [ ! -e "$HOME/.dir_colors/dircolors" ] && [ ! -e "$HOME/.vimrc" ] || { echo "FAIL: uninstall-dotfiles"; exit 1; }

          # Test bin module
          make install-bin
          [ -L "$HOME/bin/gen-passwd" ] || { echo "FAIL: install-bin (expected symlink)"; exit 1; }
          make uninstall-bin
          [ ! -e "$HOME/bin/gen-passwd" ] || { echo "FAIL: uninstall-bin"; exit 1; }

          # Test fonts module
          make install-fonts
          [ -f "$HOME/.local/share/fonts/MesloLGS NF Regular.ttf" ] || { echo "FAIL: install-fonts"; exit 1; }
          make uninstall-fonts
          [ ! -e "$HOME/.local/share/fonts/MesloLGS NF Regular.ttf" ] || { echo "FAIL: uninstall-fonts"; exit 1; }

          echo "PASS: All modular make targets installed and uninstalled cleanly"

      - name: Test Full Makefile install & uninstall
        run: |
          make install
          # Verify dotfile symlinks and fonts exist
          [ -f "$HOME/.local/share/fonts/MesloLGS NF Regular.ttf" ] || { echo "FAIL: MesloLGS NF fonts missing"; exit 1; }
          [ -L "$HOME/.vimrc" ] || { echo "FAIL: ~/.vimrc symlink missing"; exit 1; }
          [ -L "$HOME/.vim/UltiSnips" ] || { echo "FAIL: ~/.vim/UltiSnips symlink missing"; exit 1; }
          [ -L "$HOME/.zsh_aliases" ] || { echo "FAIL: ~/.zsh_aliases symlink missing"; exit 1; }
          [ -L "$HOME/.zsh_functions" ] || { echo "FAIL: ~/.zsh_functions symlink missing"; exit 1; }
          [ -L "$HOME/.zshrc_addendum" ] || { echo "FAIL: ~/.zshrc_addendum symlink missing"; exit 1; }
          [ -L "$HOME/.zsh_completions" ] || { echo "FAIL: ~/.zsh_completions symlink missing"; exit 1; }
          [ -L "$HOME/.p10k.zsh" ] || { echo "FAIL: ~/.p10k.zsh symlink missing"; exit 1; }
          [ -L "$HOME/.bashrc-addendum" ] || { echo "FAIL: ~/.bashrc-addendum symlink missing"; exit 1; }
          [ -L "$HOME/.environment_variables" ] || { echo "FAIL: ~/.environment_variables symlink missing"; exit 1; }
          [ -L "$HOME/.dir_colors/dircolors" ] || { echo "FAIL: ~/.dir_colors/dircolors symlink missing"; exit 1; }
          [ -L "$HOME/bin/gen-passwd" ] || { echo "FAIL: ~/bin/gen-passwd symlink missing"; exit 1; }
          echo "PASS: make install created all symlinks, fonts, and bin tools"

          make uninstall
          [ ! -e "$HOME/.local/share/fonts/MesloLGS NF Regular.ttf" ] || { echo "FAIL: MesloLGS NF fonts still exist"; exit 1; }
          [ ! -e "$HOME/.vimrc" ] || { echo "FAIL: ~/.vimrc still exists"; exit 1; }
          [ ! -e "$HOME/.zsh_aliases" ] || { echo "FAIL: ~/.zsh_aliases still exists"; exit 1; }
          [ ! -e "$HOME/.zsh_completions" ] || { echo "FAIL: ~/.zsh_completions still exists"; exit 1; }
          [ ! -e "$HOME/.p10k.zsh" ] || { echo "FAIL: ~/.p10k.zsh still exists"; exit 1; }
          [ ! -e "$HOME/.environment_variables" ] || { echo "FAIL: ~/.environment_variables still exists"; exit 1; }
          [ ! -e "$HOME/bin/gen-passwd" ] || { echo "FAIL: ~/bin/gen-passwd still exists"; exit 1; }
          echo "PASS: make uninstall cleaned all symlinks, fonts, and bin tools"

      - name: Report Summary
        if: always()
        run: |
          echo "### 📦 Dotfiles & Makefile Test Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ **\`make install\` / \`make uninstall\` passed.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Dotfiles test failed! Check step logs for details.**" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Cross-Platform Setup (Ubuntu & macOS)
  # ─────────────────────────────────────────────────────────────────────────────
  test-cross-platform-setup:
    name: Setup on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Test CLI Validation
        run: |
          chmod +x setup.sh
          ./setup.sh --help
          ./setup.sh --jdk 99 && { echo "FAIL: invalid JDK should fail"; exit 1; } || echo "PASS"
          ./setup.sh --ide invalid && { echo "FAIL: invalid IDE should fail"; exit 1; } || echo "PASS"

      - name: Run Dry-Run
        run: |
          ./setup.sh --dry-run
          ./setup.sh --bootstrap --dry-run
          ./setup.sh --dotfiles-only --dry-run

      - name: Run User Dotfiles Installation
        run: |
          ./setup.sh --dotfiles-only

      - name: Report Summary
        if: always()
        run: |
          echo "### 🚀 Setup on ${{ matrix.os }} Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ **Setup on ${{ matrix.os }} executed successfully.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Setup failed! Check step logs for details.**" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Fedora Setup Script (Container)
  # ─────────────────────────────────────────────────────────────────────────────
  test-fedora:
    name: Fedora Container Setup
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install base container prerequisites
        run: |
          dnf -y install sudo curl wget findutils git
          mkdir -p /usr/local/bin
          echo '#!/bin/bash' > /usr/local/bin/snap
          echo 'echo "Mock snap: $@"' >> /usr/local/bin/snap
          chmod +x /usr/local/bin/snap

      - name: Test CLI help and validation
        run: |
          chmod +x setup.sh
          ./setup.sh --os fedora --help
          ./setup.sh --os fedora --dry-run

      - name: Run User Dotfiles Setup
        run: |
          ./setup.sh --os fedora --dotfiles-only

      - name: Report Summary
        if: always()
        run: |
          echo "### 🎩 Fedora Setup Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ **Fedora setup executed successfully with no errors.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Fedora setup failed! Check step logs for details.**" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Shell & Vim Unit Tests & Lint
  # ─────────────────────────────────────────────────────────────────────────────
  test-unit-and-lint:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh vim git tree fd-find shellcheck
          if command -v fdfind &>/dev/null && ! command -v fd &>/dev/null; then
            sudo ln -s "$(which fdfind)" /usr/local/bin/fd
          fi

      - name: Run lint & test suite
        run: |
          make lint
          make test

      - name: Report Summary
        if: always()
        run: |
          echo "### ⚙️ Unit Test & Lint Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ **All unit tests and lint checks passed.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Unit tests or lint failed! Check step logs for details.**" >> "$GITHUB_STEP_SUMMARY"
          fi
