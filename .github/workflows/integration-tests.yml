name: Integration Tests

on:
  push:
    branches: [master, main]
    paths:
      - 'ubuntu/**'
      - 'fedora/**'
      - 'zsh-setup.sh'
      - 'bash-setup.sh'
      - 'vim-setup.sh'
      - 'bin-setup.sh'
      - 'user-setup.sh'
      - 'Makefile'
      - '.github/workflows/integration-tests.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'ubuntu/**'
      - 'fedora/**'
      - 'zsh-setup.sh'
      - 'bash-setup.sh'
      - 'vim-setup.sh'
      - 'bin-setup.sh'
      - 'user-setup.sh'
      - 'Makefile'
      - '.github/workflows/integration-tests.yml'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Dotfiles & Makefile Setup
  # ─────────────────────────────────────────────────────────────────────────────
  test-dotfiles-makefile:
    name: Dotfiles Makefile & Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test Makefile install
        run: |
          make install
          # Verify dotfile symlinks exist and point to repository
          [ -L "$HOME/.vimrc" ] || { echo "FAIL: ~/.vimrc symlink missing"; exit 1; }
          [ -L "$HOME/.vim" ] || { echo "FAIL: ~/.vim symlink missing"; exit 1; }
          [ -L "$HOME/.zsh_aliases" ] || { echo "FAIL: ~/.zsh_aliases symlink missing"; exit 1; }
          [ -L "$HOME/.zsh_functions" ] || { echo "FAIL: ~/.zsh_functions symlink missing"; exit 1; }
          [ -L "$HOME/.zshrc_addendum" ] || { echo "FAIL: ~/.zshrc_addendum symlink missing"; exit 1; }
          [ -L "$HOME/.bashrc-addendum" ] || { echo "FAIL: ~/.bashrc-addendum symlink missing"; exit 1; }
          [ -L "$HOME/.environment_variables" ] || { echo "FAIL: ~/.environment_variables symlink missing"; exit 1; }
          [ -L "$HOME/.dir_colors/dircolors" ] || { echo "FAIL: ~/.dir_colors/dircolors symlink missing"; exit 1; }
          echo "PASS: make install created all symlinks"

      - name: Test Makefile uninstall
        run: |
          make uninstall
          [ ! -e "$HOME/.vimrc" ] || { echo "FAIL: ~/.vimrc still exists"; exit 1; }
          [ ! -e "$HOME/.vim" ] || { echo "FAIL: ~/.vim still exists"; exit 1; }
          [ ! -e "$HOME/.zsh_aliases" ] || { echo "FAIL: ~/.zsh_aliases still exists"; exit 1; }
          [ ! -e "$HOME/.environment_variables" ] || { echo "FAIL: ~/.environment_variables still exists"; exit 1; }
          echo "PASS: make uninstall cleaned all symlinks"

      - name: Test bin-setup.sh
        run: |
          ./bin-setup.sh
          [ -d "$HOME/bin" ] || { echo "FAIL: ~/bin directory missing"; exit 1; }
          [ -x "$HOME/bin/gen-passwd" ] || { echo "FAIL: ~/bin/gen-passwd missing"; exit 1; }
          echo "PASS: bin-setup.sh populated ~/bin"

  # ─────────────────────────────────────────────────────────────────────────────
  # Ubuntu Setup Script
  # ─────────────────────────────────────────────────────────────────────────────
  test-ubuntu:
    name: Ubuntu Setup Script
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Test CLI help and argument validation
        run: |
          chmod +x ubuntu/ubuntu_18+_setup.sh
          # Show help
          ./ubuntu/ubuntu_18+_setup.sh -h
          # Reject invalid JDK
          ./ubuntu/ubuntu_18+_setup.sh -j openjdk-99 && { echo "FAIL: should reject invalid JDK"; exit 1; } || echo "PASS: invalid JDK rejected"
          # Reject invalid IDE
          ./ubuntu/ubuntu_18+_setup.sh -i invalid-ide && { echo "FAIL: should reject invalid IDE"; exit 1; } || echo "PASS: invalid IDE rejected"

      - name: Disable Reboot & Sleep
        run: |
          sed -i 's/systemctl reboot/echo "skipping reboot"/g' ubuntu/ubuntu_18+_setup.sh
          sed -i 's/sleep [0-9]*/echo "skipping sleep"/g' ubuntu/ubuntu_18+_setup.sh

      - name: Run Ubuntu Setup (Default args)
        run: |
          sudo ./ubuntu/ubuntu_18+_setup.sh

  # ─────────────────────────────────────────────────────────────────────────────
  # Fedora Setup Script
  # ─────────────────────────────────────────────────────────────────────────────
  test-fedora:
    name: Fedora Setup Script
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Mocks and Disable Reboot
        run: |
          dnf -y install sudo curl wget findutils
          # Mock snap for docker container environment
          echo '#!/bin/bash' > /usr/bin/snap
          echo 'echo "Mocking snap command: $@"' >> /usr/bin/snap
          chmod +x /usr/bin/snap
          
          # Disable reboot and sleep
          sed -i 's/systemctl reboot/echo "skipping reboot"/g' fedora/fedora_30+_setup.sh
          sed -i 's/sleep [0-9]*/echo "skipping sleep"/g' fedora/fedora_30+_setup.sh

      - name: Test CLI help and argument validation
        run: |
          chmod +x fedora/fedora_30+_setup.sh
          # Show help
          ./fedora/fedora_30+_setup.sh -h
          # Reject invalid JDK
          ./fedora/fedora_30+_setup.sh -j openjdk-99 && { echo "FAIL: should reject invalid JDK"; exit 1; } || echo "PASS: invalid JDK rejected"
          # Reject invalid IDE
          ./fedora/fedora_30+_setup.sh -i invalid-ide && { echo "FAIL: should reject invalid IDE"; exit 1; } || echo "PASS: invalid IDE rejected"

      - name: Run Fedora Setup (Default args)
        run: |
          sudo ./fedora/fedora_30+_setup.sh

  # ─────────────────────────────────────────────────────────────────────────────
  # Zsh Setup Script
  # ─────────────────────────────────────────────────────────────────────────────
  test-zsh-setup:
    name: Zsh Setup Script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Disable chsh (requires password/interactive)
        run: |
          sed -i 's/chsh -s/echo "skipping chsh -s"/g' zsh-setup.sh

      - name: Run Zsh Setup
        run: |
          ./zsh-setup.sh
          # Verify powerlevel10k was installed
          ls -la ~/.oh-my-zsh/custom/themes/powerlevel10k

