name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Lint & Static Analysis
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ShellCheck & Syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh shellcheck

      - name: Run linting
        run: make lint

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Unit Tests
  # ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh vim git tree fd-find
          if command -v fdfind &>/dev/null && ! command -v fd &>/dev/null; then
            sudo ln -s "$(which fdfind)" /usr/local/bin/fd
          fi

      - name: Run unit tests
        run: make test

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Dotfiles & Makefile Lifecycle
  # ─────────────────────────────────────────────────────────────────────────────
  dotfiles-makefile:
    name: Dotfiles & Makefile Lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test modular Makefile targets
        run: |
          # Test dotfiles install & uninstall
          make install-dotfiles
          [ -L "$HOME/.environment-variables" ] && [ -L "$HOME/.dir-colors/dircolors" ] && [ -L "$HOME/.vimrc" ] || { echo "FAIL: install-dotfiles"; exit 1; }
          make uninstall-dotfiles
          [ ! -e "$HOME/.environment-variables" ] && [ ! -e "$HOME/.dir-colors/dircolors" ] && [ ! -e "$HOME/.vimrc" ] || { echo "FAIL: uninstall-dotfiles"; exit 1; }

          # Test bin module
          make install-bin
          [ -L "$HOME/.local/bin/gen-passwd" ] || { echo "FAIL: install-bin (expected symlink)"; exit 1; }
          make uninstall-bin
          [ ! -e "$HOME/.local/bin/gen-passwd" ] || { echo "FAIL: uninstall-bin"; exit 1; }

          # Test fonts module
          make install-fonts
          [ -f "$HOME/.local/share/fonts/MesloLGS NF Regular.ttf" ] || { echo "FAIL: install-fonts"; exit 1; }
          make uninstall-fonts
          [ ! -e "$HOME/.local/share/fonts/MesloLGS NF Regular.ttf" ] || { echo "FAIL: uninstall-fonts"; exit 1; }

          echo "PASS: All modular make targets installed and uninstalled cleanly"

      - name: Test Full Makefile install & uninstall
        run: |
          make install
          # Verify dotfile symlinks and fonts exist
          [ -f "$HOME/.local/share/fonts/MesloLGS NF Regular.ttf" ] || { echo "FAIL: MesloLGS NF fonts missing"; exit 1; }
          [ -L "$HOME/.vimrc" ] || { echo "FAIL: ~/.vimrc symlink missing"; exit 1; }
          [ -L "$HOME/.zsh-aliases" ] || { echo "FAIL: ~/.zsh-aliases symlink missing"; exit 1; }
          [ -L "$HOME/.zsh-functions" ] || { echo "FAIL: ~/.zsh-functions symlink missing"; exit 1; }
          [ -L "$HOME/.zshrc-addendum" ] || { echo "FAIL: ~/.zshrc-addendum symlink missing"; exit 1; }
          [ -L "$HOME/.zsh-completions" ] || { echo "FAIL: ~/.zsh-completions symlink missing"; exit 1; }
          [ -L "$HOME/.p10k.zsh" ] || { echo "FAIL: ~/.p10k.zsh symlink missing"; exit 1; }
          [ -L "$HOME/.bashrc-addendum" ] || { echo "FAIL: ~/.bashrc-addendum symlink missing"; exit 1; }
          [ -L "$HOME/.environment-variables" ] || { echo "FAIL: ~/.environment-variables symlink missing"; exit 1; }
          [ -L "$HOME/.dir-colors/dircolors" ] || { echo "FAIL: ~/.dir-colors/dircolors symlink missing"; exit 1; }
          [ -L "$HOME/.local/bin/gen-passwd" ] || { echo "FAIL: ~/.local/bin/gen-passwd symlink missing"; exit 1; }
          echo "PASS: make install created all symlinks, fonts, and bin tools"

          make uninstall
          [ ! -e "$HOME/.local/share/fonts/MesloLGS NF Regular.ttf" ] || { echo "FAIL: MesloLGS NF fonts still exist"; exit 1; }
          [ ! -e "$HOME/.vimrc" ] || { echo "FAIL: ~/.vimrc still exists"; exit 1; }
          [ ! -e "$HOME/.zsh-aliases" ] || { echo "FAIL: ~/.zsh-aliases still exists"; exit 1; }
          [ ! -e "$HOME/.zsh-completions" ] || { echo "FAIL: ~/.zsh-completions still exists"; exit 1; }
          [ ! -e "$HOME/.p10k.zsh" ] || { echo "FAIL: ~/.p10k.zsh still exists"; exit 1; }
          [ ! -e "$HOME/.environment-variables" ] || { echo "FAIL: ~/.environment-variables still exists"; exit 1; }
          [ ! -e "$HOME/.local/bin/gen-passwd" ] || { echo "FAIL: ~/.local/bin/gen-passwd still exists"; exit 1; }
          echo "PASS: make uninstall cleaned all symlinks, fonts, and bin tools"

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Cross-Platform Setup Engine (Ubuntu & macOS Matrix)
  # ─────────────────────────────────────────────────────────────────────────────
  cross-platform-setup:
    name: Setup on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Test CLI Validation
        run: |
          chmod +x setup.sh
          ./setup.sh --help
          ./setup.sh --jdk 99 && { echo "FAIL: invalid JDK should fail"; exit 1; } || echo "PASS"
          ./setup.sh --ide invalid && { echo "FAIL: invalid IDE should fail"; exit 1; } || echo "PASS"

      - name: Run Dry-Run
        run: |
          ./setup.sh --dry-run
          ./setup.sh --bootstrap --dry-run
          ./setup.sh --dotfiles-only --dry-run

      - name: Run User Dotfiles Installation
        run: |
          ./setup.sh --dotfiles-only

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. Fedora Container Setup
  # ─────────────────────────────────────────────────────────────────────────────
  fedora-container:
    name: Fedora Container Setup
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install base container prerequisites
        run: |
          dnf -y install sudo curl wget findutils git
          mkdir -p /usr/local/bin
          echo '#!/bin/bash' > /usr/local/bin/snap
          echo 'echo "Mock snap: $@"' >> /usr/local/bin/snap
          chmod +x /usr/local/bin/snap

      - name: Test CLI help and validation
        run: |
          chmod +x setup.sh
          ./setup.sh --os fedora --help
          ./setup.sh --os fedora --dry-run

      - name: Run User Dotfiles Setup
        run: |
          ./setup.sh --os fedora --dotfiles-only

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. Standalone CLI Utility Tests
  # ─────────────────────────────────────────────────────────────────────────────
  script-gen-passwd:
    name: Test gen-passwd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make executable
        run: chmod +x common-bin/gen-passwd
      - name: Default length is 16
        run: |
          output=$(common-bin/gen-passwd)
          len=${#output}
          [ "$len" -eq 16 ] || { echo "FAIL: expected length 16, got $len ('$output')"; exit 1; }
      - name: Custom length (32)
        run: |
          output=$(common-bin/gen-passwd 32)
          len=${#output}
          [ "$len" -eq 32 ] || { echo "FAIL: expected length 32, got $len"; exit 1; }
      - name: Uppercase-only flag (-u)
        run: |
          output=$(common-bin/gen-passwd -u 20)
          echo "$output" | grep -qE '^[A-Z]+$' || { echo "FAIL: expected uppercase"; exit 1; }
      - name: Numbers-only flag (-n)
        run: |
          output=$(common-bin/gen-passwd -n 20)
          echo "$output" | grep -qE '^[0-9]+$' || { echo "FAIL: expected numbers"; exit 1; }
      - name: Lowercase-only flag (-l)
        run: |
          output=$(common-bin/gen-passwd -l 20)
          echo "$output" | grep -qE '^[a-z]+$' || { echo "FAIL: expected lowercase"; exit 1; }
      - name: Combined flags (-u -l -n)
        run: |
          output=$(common-bin/gen-passwd -u -l -n 40)
          len=${#output}
          [ "$len" -eq 40 ] || { echo "FAIL: expected length 40, got $len"; exit 1; }
          echo "$output" | grep -qE '^[A-Za-z0-9]+$' || { echo "FAIL: unexpected chars"; exit 1; }
      - name: Non-numeric length argument exits non-zero
        run: |
          common-bin/gen-passwd abc && { echo "FAIL: should exit non-zero"; exit 1; } || echo "PASS"

  script-repeat-until-success:
    name: Test repeat-until-success
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make executable
        run: chmod +x common-bin/repeat-until-success
      - name: Succeeds immediately with 'true'
        run: common-bin/repeat-until-success -n 3 -s 0 true
      - name: Fails after max retries with 'false'
        run: |
          common-bin/repeat-until-success -n 3 -s 0 false \
            && { echo "FAIL: should exit non-zero"; exit 1; } || echo "PASS"
      - name: Succeeds on later attempt
        run: |
          COUNT_FILE=$(mktemp)
          echo 0 > "$COUNT_FILE"
          TRY_SCRIPT=$(mktemp)
          cat > "$TRY_SCRIPT" <<EOF
          #!/bin/bash
          count=\$(cat "$COUNT_FILE")
          count=\$((count + 1))
          echo \$count > "$COUNT_FILE"
          [ "\$count" -ge 3 ]
          EOF
          chmod +x "$TRY_SCRIPT"
          common-bin/repeat-until-success -n 5 -s 0 "$TRY_SCRIPT"
          final=$(cat "$COUNT_FILE")
          [ "$final" -eq 3 ] || { echo "FAIL: expected 3 attempts, got $final"; exit 1; }

  script-sum:
    name: Test sum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make executable
        run: chmod +x common-bin/sum
      - name: Sum a list of integers
        run: |
          result=$(printf '1\n2\n3\n4\n5\n' | common-bin/sum)
          [ "$result" -eq 15 ] || { echo "FAIL: expected 15, got $result"; exit 1; }
      - name: Sum with negative numbers
        run: |
          result=$(printf '10\n-3\n7\n' | common-bin/sum)
          [ "$result" -eq 14 ] || { echo "FAIL: expected 14, got $result"; exit 1; }
      - name: Sum positional arguments
        run: |
          result=$(common-bin/sum 1 2 3 4)
          [ "$result" -eq 10 ] || { echo "FAIL: expected 10, got $result"; exit 1; }
      - name: Sum comma-separated values
        run: |
          result=$(common-bin/sum 1,2,3,4,5)
          [ "$result" -eq 15 ] || { echo "FAIL: expected 15, got $result"; exit 1; }
      - name: Sum delimited column (-d and -k)
        run: |
          result=$(printf "item1:100:foo\nitem2:250:bar\nitem3:50:baz\n" | common-bin/sum -d ':' -k 2)
          [ "$result" -eq 400 ] || { echo "FAIL: expected 400, got $result"; exit 1; }
      - name: Sum multiple file arguments
        run: |
          FILE1=$(mktemp)
          FILE2=$(mktemp)
          echo "10 20" > "$FILE1"
          echo "30 40" > "$FILE2"
          result=$(common-bin/sum "$FILE1" "$FILE2")
          rm -f "$FILE1" "$FILE2"
          [ "$result" -eq 100 ] || { echo "FAIL: expected 100, got $result"; exit 1; }
      - name: Sum human-readable byte units (-H)
        run: |
          result=$(common-bin/sum -H 10K 5M 2G)
          [ "$result" = "2.15274e+09" ] || [ "$result" = "2152736768" ] || { echo "FAIL: got $result"; exit 1; }
      - name: Compute average (-a) and formatted output (-f)
        run: |
          result=$(common-bin/sum -a -f "%.2f" 10 20 30 40)
          [ "$result" = "25.00" ] || { echo "FAIL: expected 25.00, got $result"; exit 1; }
      - name: Output summary statistics (-s)
        run: |
          output=$(common-bin/sum -s 5 10 15 20)
          echo "$output" | grep -q "count: 4" || { echo "FAIL count"; exit 1; }
          echo "$output" | grep -q "min: 5" || { echo "FAIL min"; exit 1; }
          echo "$output" | grep -q "max: 20" || { echo "FAIL max"; exit 1; }
          echo "$output" | grep -q "mean: 12.5" || { echo "FAIL mean"; exit 1; }
          echo "$output" | grep -q "sum: 50" || { echo "FAIL sum"; exit 1; }

  script-mvn-release:
    name: Test mvn-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make executable
        run: chmod +x common-bin/mvn-release
      - name: Rejects invalid branch
        run: |
          TMP_REPO=$(mktemp -d)
          git init "$TMP_REPO"
          cd "$TMP_REPO"
          git config user.email "ci@example.com"
          git config user.name "CI Runner"
          git checkout -b feature-branch
          "$GITHUB_WORKSPACE/common-bin/mvn-release" \
            && { echo "FAIL: should reject disallowed branch"; exit 1; } || echo "PASS"

  # ─────────────────────────────────────────────────────────────────────────────
  # 7. CI Gatekeeper: Aggregated Status Check
  # ─────────────────────────────────────────────────────────────────────────────
  ci-gatekeeper:
    name: "CI / All Checks Passed"
    runs-on: ubuntu-latest
    needs:
      - lint
      - unit-tests
      - dotfiles-makefile
      - cross-platform-setup
      - fedora-container
      - script-gen-passwd
      - script-repeat-until-success
      - script-sum
      - script-mvn-release
    if: always()
    steps:
      - name: Verify all checks succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "❌ One or more CI checks failed or were cancelled."
            exit 1
          fi
          echo "✅ All CI checks passed successfully!"
