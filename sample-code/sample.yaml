# =============================================================================
# Kubernetes deployment manifest demonstrating YAML constructs:
# anchors, aliases, merge keys, block/flow scalars, multi-document.
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-collector
  namespace: observability
  labels: &common-labels
    app.kubernetes.io/name: telemetry-collector
    app.kubernetes.io/version: "3.8.1"
    app.kubernetes.io/component: collector
    app.kubernetes.io/managed-by: helm
    environment: production
  annotations:
    deployment.kubernetes.io/revision: !!str 42
    description: >-
      High-performance OpenTelemetry collector
      for distributed trace ingestion and
      tail-based sampling pipelines.
spec:
  replicas: 3
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-collector
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        <<: *common-labels
        pod-template-hash: null
    spec:
      serviceAccountName: telemetry-collector
      terminationGracePeriodSeconds: 30
      securityContext: &pod-security
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: collector
          image: registry.internal.io/telemetry-collector:3.8.1-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - { name: grpc, containerPort: 4317, protocol: TCP }
            - { name: http, containerPort: 4318, protocol: TCP }
            - { name: metrics, containerPort: 9090, protocol: TCP }
          env:
            - name: LOG_LEVEL
              value: info
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/name']
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: BATCH_SIZE
              value: !!str 4096
            - name: SAMPLE_RATE
              value: "0.15"
            - name: ENABLE_TRACING
              value: "true"
            - name: COMPRESSION_ENABLED
              value: "false"
          resources: &resource-defaults
            limits:
              cpu: "2"
              memory: 1Gi
              ephemeral-storage: 512Mi
            requests:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4318
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 4318
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/collector
              readOnly: true
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
          securityContext:
            <<: *pod-security
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

      volumes:
        - name: config
          configMap:
            name: collector-config
        - name: tls-certs
          secret:
            secretName: collector-tls
            defaultMode: 0o440

      tolerations:
        - key: dedicated
          operator: Equal
          value: observability
          effect: NoSchedule

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: telemetry-collector
                topologyKey: kubernetes.io/hostname

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: telemetry-collector

# --- Service -----------------------------------------------------------------
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-collector
  namespace: observability
  labels:
    <<: *common-labels
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: telemetry-collector
  ports:
    - name: grpc
      port: 4317
      targetPort: grpc
      protocol: TCP
    - name: http
      port: 4318
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  sessionAffinity: None
  # Multi-line note about the service configuration
  # kept as standard comments for documentation clarity
