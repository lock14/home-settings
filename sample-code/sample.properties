# =============================================================================
# Spring Boot application configuration demonstrating Java properties syntax:
# comments, key=value, key:value, continuations, unicode, special characters.
# =============================================================================

# --- Application Identity ----------------------------------------------------
spring.application.name=solarized-gateway
spring.application.version=3.8.1
spring.profiles.active=production

! Server Configuration (exclamation-mark comment style)
server.port=8080
server.address=0.0.0.0
server.servlet.context-path=/api
server.tomcat.max-connections=4096
server.tomcat.accept-count=1024
server.tomcat.connection-timeout=20000
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html

# --- Database Configuration --------------------------------------------------
spring.datasource.url=jdbc\:postgresql\://db.internal.io\:5432/gateway
spring.datasource.username=gateway_svc
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# --- Security ----------------------------------------------------------------
spring.security.oauth2.resourceserver.jwt.issuer-uri=\
    https://auth.example.com/realms/production
spring.security.oauth2.resourceserver.jwt.audiences=gateway-api
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized

# --- Observability -----------------------------------------------------------
management.tracing.sampling.probability=0.15
management.otlp.tracing.endpoint=https://collector.internal.io:4317
management.otlp.tracing.compression=zstd
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${spring.profiles.active}

# --- Logging -----------------------------------------------------------------
logging.level.root=INFO
logging.level.com.example.gateway=DEBUG
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n

# --- Cache -------------------------------------------------------------------
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize\=10000,expireAfterWrite\=300s
spring.cache.cache-names=routes,sessions,rate-limits

# --- Rate Limiting -----------------------------------------------------------
gateway.rate-limit.default.max-requests=1000
gateway.rate-limit.default.window-seconds=60
gateway.rate-limit.default.burst-multiplier=1.5

# --- Internationalization (Unicode) ------------------------------------------
welcome.message.en=Welcome to the API Gateway
welcome.message.ja=API\u30B2\u30FC\u30C8\u30A6\u30A7\u30A4\u3078\u3088\u3046\u3053\u305D
welcome.message.de=Willkommen beim API-Gateway
welcome.message.emoji=Gateway \u2728 Ready \u2705

# --- Feature Flags -----------------------------------------------------------
feature.adaptive-sampling.enabled=true
feature.service-graph.enabled=false
feature.legacy-format-support.enabled=false
feature.experimental-compression.enabled=true

# --- Multi-line value with backslash continuation -----------------------------
gateway.cors.allowed-origins=\
    https://app.example.com,\
    https://admin.example.com,\
    https://staging.example.com

# --- Custom headers (colon delimiter style) ----------------------------------
gateway.headers.X-Request-Id: ${random.uuid}
gateway.headers.X-Gateway-Version: ${spring.application.version}
gateway.headers.X-Environment: ${spring.profiles.active}
