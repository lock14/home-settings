<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Alias legacy MesloLGS NF and official Nerd Fonts v3 MesloLGS Nerd Font</description>
  <alias>
    <family>MesloLGS NF</family>
    <prefer>
      <family>MesloLGS Nerd Font</family>
    </prefer>
  </alias>
  <alias>
    <family>MesloLGS Nerd Font</family>
    <prefer>
      <family>MesloLGS NF</family>
    </prefer>
  </alias>
</fontconfig>
