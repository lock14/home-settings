<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Alias legacy MesloLGS NF to MesloLGS Nerd Font</description>
  <!-- Match 'MesloLGS NF' and map to 'MesloLGS Nerd Font' -->
  <match target="pattern">
    <test qual="any" name="family"><string>MesloLGS NF</string></test>
    <edit name="family" mode="assign" binding="same"><string>MesloLGS Nerd Font</string></edit>
  </match>
  <!-- Match 'MesloLGS-NF-Regular' and map to 'MesloLGS Nerd Font' -->
  <match target="pattern">
    <test qual="any" name="family"><string>MesloLGS-NF-Regular</string></test>
    <edit name="family" mode="assign" binding="same"><string>MesloLGS Nerd Font</string></edit>
  </match>
</fontconfig>
