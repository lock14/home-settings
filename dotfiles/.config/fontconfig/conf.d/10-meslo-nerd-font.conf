<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Fallback between MesloLGS NF and official Nerd Fonts v3 MesloLGS Nerd Font</description>
  <alias>
    <family>MesloLGS NF</family>
    <accept>
      <family>MesloLGS Nerd Font</family>
    </accept>
  </alias>
  <alias>
    <family>MesloLGS Nerd Font</family>
    <accept>
      <family>MesloLGS NF</family>
    </accept>
  </alias>
</fontconfig>
