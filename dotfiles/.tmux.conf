# ==============================================================================
# Tmux Configuration (.tmux.conf)
# Hybrid Terminal IDE Architecture (Linux & macOS)
# Visual Theme: Authentic Ethan Schoonover Solarized Dark (24-bit TrueColor)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Terminal Capabilities, TrueColor & Diagnostic Undercurls
# ------------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB:extkeys:usstyle:clipboard:hyperlinks"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -ga update-environment " IDE_AI_CLI DISPLAY WAYLAND_DISPLAY XAUTHORITY DBUS_SESSION_BUS_ADDRESS"

# ------------------------------------------------------------------------------
# 2. Core Ergonomics, Mouse & Unified System Clipboard (GNOME Terminal / X11 / Wayland / macOS)
# ------------------------------------------------------------------------------
set -sg escape-time 0
set -s extended-keys on
set -g mouse on
set -g focus-events on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g set-clipboard on
set -g allow-passthrough on

# Cross-platform clipboard sink for GNOME Terminal (libvte ignores OSC 52), X11, Wayland, and macOS.
# Populates both X11 clipboard (Ctrl+V / Ctrl+Shift+V) and primary selection (Middle-Click) via xsel/xclip/ide.
set -s copy-command 'if [ -x "$HOME/.local/bin/ide" ]; then "$HOME/.local/bin/ide" --copy; else if [ -z "${DISPLAY:-}" ] && [ -S /tmp/.X11-unix/X0 ]; then export DISPLAY=:0; for auth in "/run/user/$(id -u)"/.mutter-Xwaylandauth.*; do [ -f "$auth" ] && export XAUTHORITY="$auth" && break; done; fi; if command -v xsel >/dev/null 2>&1 && [ -n "${DISPLAY:-}" ]; then tee >(xsel -ip 2>/dev/null) | xsel -ib 2>/dev/null; elif command -v xclip >/dev/null 2>&1 && [ -n "${DISPLAY:-}" ]; then xclip -selection clipboard -i -f 2>/dev/null | xclip -selection primary -i >/dev/null 2>&1; elif command -v wl-copy >/dev/null 2>&1 && [ -n "${WAYLAND_DISPLAY:-}" ]; then wl-copy >/dev/null 2>&1; elif command -v pbcopy >/dev/null 2>&1; then pbcopy 2>/dev/null; else cat >/dev/null; fi; fi'

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel
bind -n DoubleClick1Pane select-pane -t = \; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'copy-mode -H \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel'
bind -n TripleClick1Pane select-pane -t = \; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'copy-mode -H \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel'
bind -n MouseDown2Pane select-pane -t = \; if-shell -F '#{||:#{m/ri:^g?(view|l?n?vim?x?)(diff)?$,#{pane_current_command}},#{&&:#{==:#{@ide_role},editor},#{!:#{m/ri:^-?(ba|z|da|k|tc|c|fi)?sh$,#{pane_current_command}}}},#{&&:#{==:#{pane_current_command},mise},#{!=:#{@ide_role},ai}}}' 'send-keys -M' 'run-shell "$HOME/.local/bin/ide --paste #{pane_id}"'
bind -n MouseDown1Pane select-pane -t = \; if-shell -F '#{!=:#{mouse_hyperlink},}' 'run-shell "$HOME/.local/bin/ide --open-link #{q:mouse_hyperlink} #{q:mouse_word} #{q:pane_current_path} #{q:session_name}"' 'send-keys -M'
bind -n C-MouseDown1Pane select-pane -t = \; if-shell -F '#{&&:#{==:#{mouse_hyperlink},},#{||:#{m/ri:^g?(view|l?n?vim?x?)(diff)?$,#{pane_current_command}},#{&&:#{==:#{@ide_role},editor},#{!:#{m/ri:^-?(ba|z|da|k|tc|c|fi)?sh$,#{pane_current_command}}}},#{&&:#{==:#{pane_current_command},mise},#{!=:#{@ide_role},ai}}}}' 'send-keys -M' 'run-shell "$HOME/.local/bin/ide --open-link #{q:mouse_hyperlink} #{q:mouse_word} #{q:pane_current_path} #{q:session_name}"'

# ------------------------------------------------------------------------------
# 3. Solarized Dark Framing & Status Shelf (AGENTS.md Pillars I & VIII)
# ------------------------------------------------------------------------------
# Calm Base01 (#586E75) borders on Base03 (#002B36) canvas — zero chromatic border noise
set -g pane-border-style "fg=#586E75,bg=#002B36"
set -g pane-active-border-style "fg=#586E75,bg=#002B36"
set -g popup-border-style "fg=#586E75,bg=#002B36"
set -g popup-border-lines rounded

# Selection, Copy-Mode & Command Prompt (Base1 #93A1A1 on Base02 #073642 — no yellow bleed)
set -g mode-style "fg=#93A1A1,bg=#073642"
set -g message-style "fg=#93A1A1,bg=#073642"
set -g message-command-style "fg=#93A1A1,bg=#073642"

# Top Workspace Header Bar on Base02 (#073642) with Directional Chevrons ( / )
# Separated from the Bottom Full-Width Shell prompt and Neovim's bottom statusline
set -g status on
set -g status-position top
set -g status-style "fg=#839496,bg=#073642"
set -g status-left-length 48
set -g status-right-length 80
set -g status-left "#{?client_prefix,#[fg=#CB4B16#,bg=#073642] 󰘳 PREFIX ,#{?pane_in_mode,#[fg=#D33682#,bg=#073642] 󰆏 COPY ,#[fg=#268BD2#,bg=#073642]  #S }}#[fg=#657B83,bg=#073642] "
set -g status-right "#{?#{!=:#{@ide_ai_cli},},#[fg=#657B83#,bg=#073642]  #[fg=#2AA198#,bg=#073642]󰚩 #{@ide_ai_cli} ,}#[fg=#657B83,bg=#073642] #[fg=#839496,bg=#073642]󰉋 #{?#{!=:#{@ide_workdir},},#{b:@ide_workdir},#{b:pane_current_path}} "
setw -g window-status-format "#{?#{m/r:^_ide_park_,#W},,#[fg=#586E75,bg=#073642] #I:#W }"
setw -g window-status-current-format "#{?#{==:#W,ide},#{?#{==:#{@ide_role},ai},#[fg=#93A1A1#,bg=#073642#,nobold] 󰚩 AI (Alt+a),#[fg=#586E75#,bg=#073642#,nobold] 󰚩 AI (Alt+a)}#[fg=#586E75,bg=#073642,nobold] · #{?#{==:#{@ide_role},editor},#[fg=#93A1A1#,bg=#073642#,nobold] Editor (Alt+e),#[fg=#586E75#,bg=#073642#,nobold] Editor (Alt+e)}#[fg=#586E75,bg=#073642,nobold] · #{?#{==:#{@ide_role},term},#[fg=#93A1A1#,bg=#073642#,nobold] Shell (Alt+t) ,#[fg=#586E75#,bg=#073642#,nobold] Shell (Alt+t) }#{?window_zoomed_flag,#[fg=#657B83#,bg=#073642] #[fg=#CB4B16#,bg=#073642]󰁌 ZOOM (Alt+z) ,},#[fg=#93A1A1,bg=#073642,nobold] #I:#W#{?window_zoomed_flag, #[fg=#CB4B16]󰁌 ZOOM,} }"
setw -g window-status-separator ""

# ------------------------------------------------------------------------------
# 4. First-Principles 4-Layer Spatial Navigation (Alt + h/j/k/l)
# ------------------------------------------------------------------------------
# Layer 1 (Ctrl+h/j/k/l) belongs strictly to the active foreground application:
#   - Shell / TUI / AI CLI: native Ctrl+L (clear), Ctrl+J (newline), Ctrl+K (kill-to-EOL), Ctrl+H (backspace).
#   - Neovim Normal Mode: internal split navigation only (wincmd h/j/k/l).
# Explicitly unbind C-h/j/k/l in root table so source-file reloads purge any stale bindings.
unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l

# Layer 2 (Alt+h/j/k/l) provides universal 2D spatial navigation from any pane or mode:
#   - Inside Editor (@ide_role=editor or vim/nvim), forwards M-h/j/k/l to Neovim so it traverses
#     internal splits first and steps out to adjacent Tmux panes at the edge.
#   - Inside Shell (@ide_role=term) or AI (@ide_role=ai), selects the adjacent Tmux pane directly.
bind -n M-h if-shell -F '#{||:#{m/ri:^g?(view|l?n?vim?x?)(diff)?$,#{pane_current_command}},#{&&:#{==:#{@ide_role},editor},#{!:#{m/ri:^-?(ba|z|da|k|tc|c|fi)?sh$,#{pane_current_command}}}},#{&&:#{==:#{pane_current_command},mise},#{!=:#{@ide_role},ai}}}' 'send-keys M-h' 'select-pane -L'
bind -n M-j if-shell -F '#{||:#{m/ri:^g?(view|l?n?vim?x?)(diff)?$,#{pane_current_command}},#{&&:#{==:#{@ide_role},editor},#{!:#{m/ri:^-?(ba|z|da|k|tc|c|fi)?sh$,#{pane_current_command}}}},#{&&:#{==:#{pane_current_command},mise},#{!=:#{@ide_role},ai}}}' 'send-keys M-j' 'select-pane -D'
bind -n M-k if-shell -F '#{||:#{m/ri:^g?(view|l?n?vim?x?)(diff)?$,#{pane_current_command}},#{&&:#{==:#{@ide_role},editor},#{!:#{m/ri:^-?(ba|z|da|k|tc|c|fi)?sh$,#{pane_current_command}}}},#{&&:#{==:#{pane_current_command},mise},#{!=:#{@ide_role},ai}}}' 'send-keys M-k' 'select-pane -U'
bind -n M-l if-shell -F '#{||:#{m/ri:^g?(view|l?n?vim?x?)(diff)?$,#{pane_current_command}},#{&&:#{==:#{@ide_role},editor},#{!:#{m/ri:^-?(ba|z|da|k|tc|c|fi)?sh$,#{pane_current_command}}}},#{&&:#{==:#{pane_current_command},mise},#{!=:#{@ide_role},ai}}}' 'send-keys M-l' 'select-pane -R'

# ------------------------------------------------------------------------------
# 5. Workspace Ergonomics: Role Jumps, Toggle Visibility, Swap, Zoom, Resize & Quit
# ------------------------------------------------------------------------------
# Toggle zoom on the active pane
bind -n M-z resize-pane -Z

# Retire legacy M-1/2/3 bindings (conflict with terminal tab switching and header order)
unbind -n M-1
unbind -n M-2
unbind -n M-3

# Focus AI Agent (@ide_ai_pane) or bounce back to Editor (unparking if hidden)
bind -n M-a run-shell "$HOME/.local/bin/ide --toggle '#{session_name}'"
bind a run-shell "$HOME/.local/bin/ide --toggle '#{session_name}'"

# Focus Editor pane (@ide_editor_pane) or bounce back to AI (unparking if hidden)
bind -n M-e run-shell "$HOME/.local/bin/ide --show-editor '#{session_name}'"

# Focus Shell pane (@ide_term_pane) or bounce back to Editor (unparking if hidden)
bind -n M-t run-shell "$HOME/.local/bin/ide --show-term '#{session_name}'"

# Toggle visibility (hide/unpark) of Editor and Shell panes from anywhere (Alt+Shift+E / Alt+Shift+T)
bind -n M-E run-shell "$HOME/.local/bin/ide --toggle-editor '#{session_name}'"
bind -n M-T run-shell "$HOME/.local/bin/ide --toggle-term '#{session_name}'"

# Swap active pane with neighbor Left / Down / Up / Right (Alt+Shift+H/J/K/L)
bind -n M-H run-shell "$HOME/.local/bin/ide --swap left '#{session_name}'"
bind -n M-J run-shell "$HOME/.local/bin/ide --swap down '#{session_name}'"
bind -n M-K run-shell "$HOME/.local/bin/ide --swap up '#{session_name}'"
bind -n M-L run-shell "$HOME/.local/bin/ide --swap right '#{session_name}'"

# Resize active pane by 5 cells (Alt+Arrow or Prefix+H/J/K/L)
bind -n M-Left resize-pane -L 5
bind -n M-Down resize-pane -D 5
bind -n M-Up resize-pane -U 5
bind -n M-Right resize-pane -R 5
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Mouse resize: drag any pane border (AI | Editor, or the Shell's top edge) with the left button.
# Pinned tmux default so it stays documented and tested; focus switches and zoom keep dragged sizes.
bind -n MouseDrag1Border resize-pane -M

# Safely quit the entire IDE workspace with one command (checks for unsaved Neovim buffers first; Alt+Shift+Q force-quits)
bind -n M-q run-shell "$HOME/.local/bin/ide --quit '#{session_name}'"
bind -n M-Q run-shell "$HOME/.local/bin/ide --quit --force '#{session_name}'"
bind q run-shell "$HOME/.local/bin/ide --quit '#{session_name}'"

# Optional Floating AI Modal (Alt+Shift+a) for ad-hoc overlay popup
bind -n M-A if-shell -F '#{m/r:^(ai|agy)-,#{session_name}}' \
    'detach-client' \
    'display-popup -E -w 85% -h 85% -d "#{pane_current_path}" "tmux new-session -A -s \"ai-#{session_name}\" -c \"#{pane_current_path}\" \"\$HOME/.local/bin/ide --run-ai-popup #{session_name}\""'

# Intuitive Split Creation & Top Bar Toggle
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind b set-option status
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"
