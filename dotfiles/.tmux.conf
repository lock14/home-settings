# ==============================================================================
# Tmux Configuration (.tmux.conf)
# Hybrid Terminal IDE Architecture (Linux & macOS)
# Visual Theme: Authentic Ethan Schoonover Solarized Dark (24-bit TrueColor)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Terminal Capabilities, TrueColor & Diagnostic Undercurls
# ------------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB:extkeys:usstyle"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -ga update-environment " IDE_AI_CLI"

# ------------------------------------------------------------------------------
# 2. Core Ergonomics & Responsiveness
# ------------------------------------------------------------------------------
set -sg escape-time 0
set -g mouse on
set -g focus-events on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g set-clipboard on

# ------------------------------------------------------------------------------
# 3. Solarized Dark Framing & Status Shelf (AGENTS.md Pillars I & VIII)
# ------------------------------------------------------------------------------
# Calm Base01 (#586E75) borders on Base03 (#002B36) canvas — zero chromatic border noise
set -g pane-border-style "fg=#586E75,bg=#002B36"
set -g pane-active-border-style "fg=#586E75,bg=#002B36"
set -g popup-border-style "fg=#586E75,bg=#002B36"
set -g popup-border-lines rounded

# Selection, Copy-Mode & Command Prompt (Base1 #93A1A1 on Base02 #073642 — no yellow bleed)
set -g mode-style "fg=#93A1A1,bg=#073642"
set -g message-style "fg=#93A1A1,bg=#073642"
set -g message-command-style "fg=#93A1A1,bg=#073642"

# Status Bar Shelf on Base02 (#073642) with Base0 (#839496) & Directional Chevrons ( / )
set -g status-position bottom
set -g status-style "fg=#839496,bg=#073642"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#268BD2,bg=#073642]  #S #[fg=#657B83,bg=#073642] "
set -g status-right "#[fg=#657B83,bg=#073642]  #[fg=#839496,bg=#073642]#{b:pane_current_path} #[fg=#657B83,bg=#073642] #[fg=#586E75,bg=#073642]%H:%M "
setw -g window-status-format "#{?#{==:#W,_swap},,#[fg=#586E75,bg=#073642] #I:#W }"
setw -g window-status-current-format "#{?#{==:#W,code},#[fg=#93A1A1,bg=#073642,bold]  code #[fg=#586E75,bg=#073642,nobold]⇄ ai [Alt+a]#{?window_zoomed_flag, #[fg=#93A1A1]󰁌,} ,#{?#{==:#W,ai},#[fg=#6C71C4,bg=#073642,bold] 󰚩 ai #[fg=#586E75,bg=#073642,nobold]⇄ code [Alt+a]#{?window_zoomed_flag, #[fg=#93A1A1]󰁌,} ,#[fg=#93A1A1,bg=#073642,bold] #I:#W#{?window_zoomed_flag, 󰁌,} }}"
setw -g window-status-separator ""

# If user navigates to the hidden _swap parking window via next/last-window, swap Main Pane in-place instead
set-hook -g session-window-changed 'if-shell -F "#{==:#{window_name},_swap}" "run-shell \"\$HOME/.local/bin/ide --toggle #{session_name}\""'

# ------------------------------------------------------------------------------
# 4. Zero-Fork Unified Navigation (Ctrl + h/j/k/l across Neovim & Tmux Panes)
# ------------------------------------------------------------------------------
# Matches vim/nvim/view/vimdiff and mise-shimmed Neovim without spawning subshells,
# preserving Alt+Arrow word-hopping and never sending C-h (backspace) to fzf.
bind -n C-h if-shell -F '#{m/ri:^(g?(view|l?n?vim?x?)(diff)?|mise)$,#{pane_current_command}}' 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell -F '#{m/ri:^(g?(view|l?n?vim?x?)(diff)?|mise)$,#{pane_current_command}}' 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell -F '#{m/ri:^(g?(view|l?n?vim?x?)(diff)?|mise)$,#{pane_current_command}}' 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell -F '#{m/ri:^(g?(view|l?n?vim?x?)(diff)?|mise)$,#{pane_current_command}}' 'send-keys C-l' 'select-pane -R'

# ------------------------------------------------------------------------------
# 5. Workspace Ergonomics: Pane Zoom (Alt+z) & In-Place Main Pane Toggle (Alt+a)
# ------------------------------------------------------------------------------
bind -n M-z resize-pane -Z

# Toggle the Main Pane in-place between the Text Editor and the AI Agent (`IDE_AI_CLI`: agy | claude | codex)
# while keeping both the Left Directory Pane and Bottom Terminal Pane permanently anchored.
bind -n M-a run-shell "$HOME/.local/bin/ide --toggle '#{session_name}'"
bind a run-shell "$HOME/.local/bin/ide --toggle '#{session_name}'"

# Safely quit the entire IDE workspace with one command (checks for unsaved Neovim buffers first)
bind -n M-q run-shell "$HOME/.local/bin/ide --quit '#{session_name}'"
bind q run-shell "$HOME/.local/bin/ide --quit '#{session_name}'"

# Optional Floating AI Modal (Alt+Shift+a) for ad-hoc overlay popup
bind -n M-A if-shell -F '#{m/r:^(ai|agy)-,#{session_name}}' \
    'detach-client' \
    'display-popup -E -w 85% -h 85% -d "#{pane_current_path}" "tmux new-session -A -s \"ai-#{session_name}\" -c \"#{pane_current_path}\" \"\$HOME/.local/bin/ide --run-ai-popup #{session_name}\""'

# Intuitive Split Creation in Current Working Directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"
