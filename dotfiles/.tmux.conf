# ==============================================================================
# Tmux Configuration (.tmux.conf)
# Hybrid Terminal IDE Architecture (Linux & macOS)
# Visual Theme: Authentic Ethan Schoonover Solarized Dark (24-bit TrueColor)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Terminal Capabilities, TrueColor & Diagnostic Undercurls
# ------------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB:extkeys:usstyle:clipboard:hyperlinks"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -ga update-environment " IDE_AI_CLI DISPLAY WAYLAND_DISPLAY XAUTHORITY DBUS_SESSION_BUS_ADDRESS"

# ------------------------------------------------------------------------------
# 2. Core Ergonomics, Mouse & Unified System Clipboard (GNOME Terminal / X11 / Wayland / macOS)
# ------------------------------------------------------------------------------
set -sg escape-time 0
set -g mouse on
set -g focus-events on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g set-clipboard on
set -g allow-passthrough on

# Cross-platform clipboard sink for GNOME Terminal (libvte ignores OSC 52), X11, Wayland, and macOS.
# Populates both X11 clipboard (Ctrl+V / Ctrl+Shift+V) and primary selection (Middle-Click) via xsel/xclip/ide.
set -s copy-command 'if [ -x "$HOME/.local/bin/ide" ]; then "$HOME/.local/bin/ide" --copy; else if [ -z "${DISPLAY:-}" ] && [ -S /tmp/.X11-unix/X0 ]; then export DISPLAY=:0; for auth in "/run/user/$(id -u)"/.mutter-Xwaylandauth.*; do [ -f "$auth" ] && export XAUTHORITY="$auth" && break; done; fi; if command -v xsel >/dev/null 2>&1 && [ -n "${DISPLAY:-}" ]; then tee >(xsel -ip 2>/dev/null) | xsel -ib 2>/dev/null; elif command -v xclip >/dev/null 2>&1 && [ -n "${DISPLAY:-}" ]; then xclip -selection clipboard -i -f 2>/dev/null | xclip -selection primary -i >/dev/null 2>&1; elif command -v wl-copy >/dev/null 2>&1 && [ -n "${WAYLAND_DISPLAY:-}" ]; then wl-copy >/dev/null 2>&1; elif command -v pbcopy >/dev/null 2>&1; then pbcopy 2>/dev/null; else cat >/dev/null; fi; fi'

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel
bind -n DoubleClick1Pane select-pane -t = \; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'copy-mode -H \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel'
bind -n TripleClick1Pane select-pane -t = \; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'copy-mode -H \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel'
bind -n MouseDown2Pane select-pane -t = \; if-shell -F '#{&&:#{||:#{m/ri:^g?(view|l?n?vim?x?)(diff)?$,#{pane_current_command}},#{==:#{pane_current_command},mise}},#{&&:#{!=:#{@ide_role},ai},#{!=:#{@ide_role},term}}}' 'send-keys -M' 'run-shell "$HOME/.local/bin/ide --paste #{pane_id}"'
bind -n C-MouseDown1Pane select-pane -t = \; run-shell "$HOME/.local/bin/ide --open-link #{q:mouse_hyperlink} #{q:mouse_word} #{q:pane_current_path}"

# ------------------------------------------------------------------------------
# 3. Solarized Dark Framing & Status Shelf (AGENTS.md Pillars I & VIII)
# ------------------------------------------------------------------------------
# Calm Base01 (#586E75) borders on Base03 (#002B36) canvas — zero chromatic border noise
set -g pane-border-style "fg=#586E75,bg=#002B36"
set -g pane-active-border-style "fg=#586E75,bg=#002B36"
set -g popup-border-style "fg=#586E75,bg=#002B36"
set -g popup-border-lines rounded

# Selection, Copy-Mode & Command Prompt (Base1 #93A1A1 on Base02 #073642 — no yellow bleed)
set -g mode-style "fg=#93A1A1,bg=#073642"
set -g message-style "fg=#93A1A1,bg=#073642"
set -g message-command-style "fg=#93A1A1,bg=#073642"

# Status Bar Shelf on Base02 (#073642) with Base0 (#839496) & Directional Chevrons ( / )
set -g status-position bottom
set -g status-style "fg=#839496,bg=#073642"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#268BD2,bg=#073642]  #S #[fg=#657B83,bg=#073642] "
set -g status-right "#[fg=#657B83,bg=#073642]  #[fg=#839496,bg=#073642]#{b:pane_current_path} #[fg=#657B83,bg=#073642] #[fg=#586E75,bg=#073642]%H:%M "
setw -g window-status-format "#{?#{==:#W,_swap},,#[fg=#586E75,bg=#073642] #I:#W }"
setw -g window-status-current-format "#{?#{==:#W,code},#[fg=#93A1A1,bg=#073642,bold]  code #[fg=#586E75,bg=#073642,nobold]⇄ ai [Alt+a]#{?window_zoomed_flag, #[fg=#93A1A1]󰁌,} ,#{?#{==:#W,ai},#[fg=#6C71C4,bg=#073642,bold] 󰚩 ai #[fg=#586E75,bg=#073642,nobold]⇄ code [Alt+a]#{?window_zoomed_flag, #[fg=#93A1A1]󰁌,} ,#[fg=#93A1A1,bg=#073642,bold] #I:#W#{?window_zoomed_flag, 󰁌,} }}"
setw -g window-status-separator ""

# If user navigates to the hidden _swap parking window via next/last-window, swap Main Pane in-place instead
set-hook -g session-window-changed 'if-shell -F "#{==:#{window_name},_swap}" "run-shell \"\$HOME/.local/bin/ide --toggle #{session_name}\""'

# ------------------------------------------------------------------------------
# 4. Zero-Fork Role-Aware Navigation (Ctrl + h/j/k/l & Alt + h/j/k/l)
# ------------------------------------------------------------------------------
# Matches vim/nvim/view/vimdiff and mise-shimmed Neovim (scoped away from @ide_role=ai and @ide_role=term
# so mise-shimmed AI CLIs and shell commands never trap Ctrl+hjkl),
# preserving Alt+Arrow word-hopping and never sending C-h (backspace) to fzf.
# In the 3-pane IDE layout, navigating Right/Up from Left Tree (@ide_role=tree) always targets
# Top-Right Main ({top-right}), and navigating Down from Left Tree targets Bottom-Right Shell ({bottom-right}).
bind -n C-h if-shell -F '#{||:#{m/ri:^g?(view|l?n?vim?x?)(diff)?$,#{pane_current_command}},#{&&:#{==:#{pane_current_command},mise},#{&&:#{!=:#{@ide_role},ai},#{!=:#{@ide_role},term}}}}' 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell -F '#{||:#{m/ri:^g?(view|l?n?vim?x?)(diff)?$,#{pane_current_command}},#{&&:#{==:#{pane_current_command},mise},#{&&:#{!=:#{@ide_role},ai},#{!=:#{@ide_role},term}}}}' 'send-keys C-j' "if-shell -F '#{==:#{@ide_role},tree}' \"select-pane -t '{bottom-right}'\" 'select-pane -D'"
bind -n C-k if-shell -F '#{||:#{m/ri:^g?(view|l?n?vim?x?)(diff)?$,#{pane_current_command}},#{&&:#{==:#{pane_current_command},mise},#{&&:#{!=:#{@ide_role},ai},#{!=:#{@ide_role},term}}}}' 'send-keys C-k' "if-shell -F '#{==:#{@ide_role},tree}' \"select-pane -t '{top-right}'\" 'select-pane -U'"
bind -n C-l if-shell -F '#{||:#{m/ri:^g?(view|l?n?vim?x?)(diff)?$,#{pane_current_command}},#{&&:#{==:#{pane_current_command},mise},#{&&:#{!=:#{@ide_role},ai},#{!=:#{@ide_role},term}}}}' 'send-keys C-l' "if-shell -F '#{==:#{@ide_role},tree}' \"select-pane -t '{top-right}'\" 'select-pane -R'"

bind -n M-h if-shell -F '#{||:#{m/ri:^g?(view|l?n?vim?x?)(diff)?$,#{pane_current_command}},#{&&:#{==:#{pane_current_command},mise},#{&&:#{!=:#{@ide_role},ai},#{!=:#{@ide_role},term}}}}' 'send-keys M-h' 'select-pane -L'
bind -n M-j if-shell -F '#{||:#{m/ri:^g?(view|l?n?vim?x?)(diff)?$,#{pane_current_command}},#{&&:#{==:#{pane_current_command},mise},#{&&:#{!=:#{@ide_role},ai},#{!=:#{@ide_role},term}}}}' 'send-keys M-j' "if-shell -F '#{==:#{@ide_role},tree}' \"select-pane -t '{bottom-right}'\" 'select-pane -D'"
bind -n M-k if-shell -F '#{||:#{m/ri:^g?(view|l?n?vim?x?)(diff)?$,#{pane_current_command}},#{&&:#{==:#{pane_current_command},mise},#{&&:#{!=:#{@ide_role},ai},#{!=:#{@ide_role},term}}}}' 'send-keys M-k' "if-shell -F '#{==:#{@ide_role},tree}' \"select-pane -t '{top-right}'\" 'select-pane -U'"
bind -n M-l if-shell -F '#{||:#{m/ri:^g?(view|l?n?vim?x?)(diff)?$,#{pane_current_command}},#{&&:#{==:#{pane_current_command},mise},#{&&:#{!=:#{@ide_role},ai},#{!=:#{@ide_role},term}}}}' 'send-keys M-l' "if-shell -F '#{==:#{@ide_role},tree}' \"select-pane -t '{top-right}'\" 'select-pane -R'"

# ------------------------------------------------------------------------------
# 5. Workspace Ergonomics: Pane Zoom (Alt+z) & In-Place Main Pane Toggle (Alt+a)
# ------------------------------------------------------------------------------
bind -n M-z resize-pane -Z

# Toggle the Main Pane in-place between the Text Editor and the AI Agent (`IDE_AI_CLI`: agy | claude | codex)
# while keeping both the Left Directory Pane and Bottom Terminal Pane permanently anchored.
bind -n M-a run-shell "$HOME/.local/bin/ide --toggle '#{session_name}'"
bind a run-shell "$HOME/.local/bin/ide --toggle '#{session_name}'"

# Safely quit the entire IDE workspace with one command (checks for unsaved Neovim buffers first; Alt+Shift+Q force-quits)
bind -n M-q run-shell "$HOME/.local/bin/ide --quit '#{session_name}'"
bind -n M-Q run-shell "$HOME/.local/bin/ide --quit --force '#{session_name}'"
bind q run-shell "$HOME/.local/bin/ide --quit '#{session_name}'"

# Optional Floating AI Modal (Alt+Shift+a) for ad-hoc overlay popup
bind -n M-A if-shell -F '#{m/r:^(ai|agy)-,#{session_name}}' \
    'detach-client' \
    'display-popup -E -w 85% -h 85% -d "#{pane_current_path}" "tmux new-session -A -s \"ai-#{session_name}\" -c \"#{pane_current_path}\" \"\$HOME/.local/bin/ide --run-ai-popup #{session_name}\""'

# Intuitive Split Creation in Current Working Directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"
