# Mise cross-platform polyglot toolchain configuration
# Works identically across Ubuntu, Fedora, and macOS (Apple Silicon + Intel)

[tool_alias]
elan = "github:leanprover/elan"

[tools]
bat = "latest"
btop = "latest"
delta = "latest"
dust = "latest"
elan = { version = "latest", rename_exe = "elan", postinstall = "for b in lean lake leanc leanmake leanchecker; do ln -sf elan \"$MISE_TOOL_INSTALL_PATH/$b\"; done && export ELAN_HOME=\"${ELAN_HOME:-${XDG_DATA_HOME:-$HOME/.local/share}/elan}\" && mkdir -p \"$ELAN_HOME/toolchains\" && (\"$MISE_TOOL_INSTALL_PATH/elan\" default stable || true)" }
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
glow = "latest"
go = "latest"
java = "lts"
jq = "latest"
maven = "latest"
neovim = "latest"
node = "lts"
python = "latest"
ripgrep = "latest"
rust = "latest"
sd = "latest"
shellcheck = "latest"
tealdeer = "latest"
terraform = "latest"
tree-sitter = "latest"
yq = "latest"
zoxide = "latest"

[settings]
legacy_version_file = true
experimental = true
go.set_gobin = false
go.set_gopath = false
