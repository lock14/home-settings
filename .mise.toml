# Mise cross-platform polyglot toolchain configuration
# Works identically across Ubuntu, Fedora, and macOS (Apple Silicon + Intel)

[tools]
java = "lts"
maven = "latest"
go = "latest"
python = "latest"
node = "lts"
terraform = "latest"
rust = "latest"
neovim = "latest"
eza = "latest"
bat = "latest"
btop = "latest"
glow = "latest"
tree-sitter = "latest"

[settings]
legacy_version_file = true
experimental = true
go.set_gobin = false
go.set_gopath = false
