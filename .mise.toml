# Mise cross-platform polyglot toolchain configuration
# Works identically across Ubuntu, Fedora, and macOS (Apple Silicon + Intel)

[tools]
bat = "latest"
btop = "latest"
delta = "latest"
dust = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
glow = "latest"
go = "latest"
java = "lts"
jq = "latest"
maven = "latest"
neovim = "latest"
node = "lts"
python = "latest"
ripgrep = "latest"
rust = "latest"
sd = "latest"
shellcheck = "latest"
tealdeer = "latest"
terraform = "latest"
tree-sitter = "latest"
yq = "latest"
zoxide = "latest"

[settings]
legacy_version_file = true
experimental = true
go.set_gobin = false
go.set_gopath = false
