# Mise cross-platform polyglot toolchain configuration
# Works identically across Ubuntu, Fedora, and macOS (Apple Silicon + Intel)

[tools]
bat = "latest"
btop = "latest"
delta = "latest"
duf = "latest"
dust = "latest"
eza = "latest"
glow = "latest"
go = "latest"
hyperfine = "latest"
java = "lts"
jless = "latest"
jq = "latest"
lazygit = "latest"
maven = "latest"
neovim = "latest"
node = "lts"
python = "latest"
rust = "latest"
tealdeer = "latest"
terraform = "latest"
tree-sitter = "latest"
yq = "latest"

[settings]
legacy_version_file = true
experimental = true
go.set_gobin = false
go.set_gopath = false
